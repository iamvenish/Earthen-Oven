<section class="hero" id="home">
    <div class="hero-bg"></div>
    <div class="hero-content">
        <div class="hero-badge reveal">
            <i class="fa-solid fa-star"></i> 4.4 / 5 Rating from Guests
        </div>
        <h1 class="hero-title reveal" style="transition-delay: 0.1s;">
            <span>Earthen Oven</span>
            Authentic North Indian<br>Fine Dining
        </h1>
        <p class="hero-subtitle reveal" style="transition-delay: 0.2s;">
            Discover the legacy of charcoal-fired flavours, artisanal kebabs, and authentic curries in the heart of
            Ahmedabad.
        </p>
        <div class="hero-cta reveal" style="transition-delay: 0.3s;">
            <a (click)="scrollTo('reservations')" class="btn btn-primary" style="cursor: pointer;">Book A Table</a>
            <a (click)="scrollTo('menu')" class="btn btn-outline" style="cursor: pointer;">Explore Menu</a>
        </div>
    </div>
    <div class="scroll-indicator">
        <span class="scroll-line"></span>
        <i class="fa-solid fa-chevron-down"></i>
    </div>
</section>
